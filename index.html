<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cristallographie VR — Mesures Physiques</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>body{margin:0}</style>
</head>
<body>
<script>
// ============ LOCOMOTION JOYSTICK ============
// Joystick gauche = avancer/reculer + gauche/droite
// Joystick droit  = monter/descendre + rotation
AFRAME.registerComponent('locomotion', {
  schema: { speed: { default: 2.5 } },
  init: function () {
    this.leftAxis = [0, 0];
    this.rightAxis = [0, 0];
    this.direction = new THREE.Vector3();
    this.rt = new THREE.Vector3();
    this.mv = new THREE.Vector3();
    // === GRAB STATE (intégré ici car tick() ne tourne PAS sur les entités laser-controls) ===
    this._grabL = { held: null, oldParent: null, wasPressed: false };
    this._grabR = { held: null, oldParent: null, wasPressed: false };
    this._prevHL = null;
    this._grabCount = 0;
    this._fc = 0;
    this._dbg = 'Init OK';
    this._err = '';
    this._tmpV = new THREE.Vector3();
    this._tmpW = new THREE.Vector3();
    var self = this;
    setTimeout(function () {
      var leftHand = document.querySelector('#left-hand');
      var rightHand = document.querySelector('#right-hand');
      if (leftHand) {
        leftHand.addEventListener('thumbstickmoved', function (evt) {
          self.leftAxis = [evt.detail.x, evt.detail.y];
        });
      }
      if (rightHand) {
        rightHand.addEventListener('thumbstickmoved', function (evt) {
          self.rightAxis = [evt.detail.x, evt.detail.y];
        });
      }
    }, 2000);
  },
  // Trouver l'objet grabbable le plus proche d'une position world
  _findClosest: function (worldPos) {
    var objs = document.querySelectorAll('[grabbable]');
    var closest = null, minD = 1.5;
    var wp = this._tmpW;
    for (var i = 0; i < objs.length; i++) {
      var o = objs[i];
      if (o.getAttribute('data-grabbed')) continue;
      o.object3D.getWorldPosition(wp);
      var dd = worldPos.distanceTo(wp);
      if (dd < minD) { minD = dd; closest = o; }
    }
    return { target: closest, dist: minD };
  },
  // Gérer le grab/release pour une main
  _processHand: function (handEl, state, gamepad) {
    var pressed = false;
    var btnInfo = '';
    if (gamepad) {
      try {
        // Seulement trigger (0) et grip (1) — les autres boutons (touch sensors) sont souvent actifs
        for (var b = 0; b <= 1 && b < gamepad.buttons.length; b++) {
          var btn = gamepad.buttons[b];
          if (btn.pressed || btn.value > 0.5) { pressed = true; btnInfo += (b === 0 ? 'T' : 'G'); }
        }
        // Debug : lister TOUS les boutons actifs pour info
        for (var b2 = 0; b2 < gamepad.buttons.length; b2++) {
          var btn2 = gamepad.buttons[b2];
          if (btn2.pressed || btn2.value > 0.3) btnInfo += '[' + b2 + ']';
        }
      } catch (e) { this._err = 'BTN:' + e.message; }
    }
    // Grab sur front montant
    if (pressed && !state.wasPressed) {
      this._grabCount++;
      var sphere = handEl.querySelector('a-sphere');
      if (sphere) sphere.setAttribute('color', '#00ff00');
      if (!state.held) {
        handEl.object3D.getWorldPosition(this._tmpV);
        var res = this._findClosest(this._tmpV);
        if (res.target) {
          // Sauvegarder position et rotation d'origine
          state.origPos = res.target.object3D.position.clone();
          state.origRot = res.target.object3D.rotation.clone();
          res.target.setAttribute('data-grabbed', 'true');
          state.held = res.target;
          state.oldParent = res.target.parentNode;
          handEl.object3D.attach(res.target.object3D);
        }
      } else {
        // Relâcher si on re-presse pendant le grab → retour position d'origine
        state.oldParent.object3D.attach(state.held.object3D);
        state.held.object3D.position.copy(state.origPos);
        state.held.object3D.rotation.copy(state.origRot);
        state.held.removeAttribute('data-grabbed');
        state.held = null;
        state.oldParent = null;
      }
    }
    // Release sur front descendant → retour position d'origine
    if (!pressed && state.wasPressed) {
      var sphere2 = handEl.querySelector('a-sphere');
      var origColor = (handEl.id === 'left-hand') ? '#ff4444' : '#4444ff';
      if (sphere2) sphere2.setAttribute('color', origColor);
      if (state.held) {
        state.oldParent.object3D.attach(state.held.object3D);
        state.held.object3D.position.copy(state.origPos);
        state.held.object3D.rotation.copy(state.origRot);
        state.held.removeAttribute('data-grabbed');
        state.held = null;
        state.oldParent = null;
      }
    }
    state.wasPressed = pressed;
    return btnInfo;
  },
  tick: function (t, dt) {
    this._fc++;
    // === LOCOMOTION (inchangée) ===
    var lx = this.leftAxis[0], ly = this.leftAxis[1];
    var rx = this.rightAxis[0], ry = this.rightAxis[1];
    var deadzone = 0.15;
    var hasLeft = Math.abs(lx) > deadzone || Math.abs(ly) > deadzone;
    var hasRight = Math.abs(rx) > deadzone || Math.abs(ry) > deadzone;
    if (dt <= 100) {
      var cam = this.el.querySelector('[camera]') || this.el.querySelector('a-camera');
      if (cam && (hasLeft || hasRight)) {
        var spd = this.data.speed * dt / 1000;
        this.mv.set(0, 0, 0);
        if (hasLeft) {
          cam.object3D.getWorldDirection(this.direction);
          this.direction.y = 0;
          this.direction.normalize();
          this.rt.crossVectors(this.direction, new THREE.Vector3(0, 1, 0)).normalize();
          this.mv.addScaledVector(this.direction, ly * spd);
          this.mv.addScaledVector(this.rt, -lx * spd);
        }
        if (hasRight) {
          if (Math.abs(ry) > deadzone) this.mv.y += -ry * spd;
          if (Math.abs(rx) > deadzone) this.el.object3D.rotation.y -= rx * 1.5 * dt / 1000;
        }
        this.el.object3D.position.add(this.mv);
      }
    }

    // === GRAB LOGIC (exécuté à chaque frame, PAS conditionné au joystick) ===
    var gpLeft = null, gpRight = null;
    var gpSource = '';
    try {
      var sceneEl = this.el.sceneEl;
      if (sceneEl && sceneEl.renderer && sceneEl.renderer.xr) {
        var session = sceneEl.renderer.xr.getSession();
        if (session && session.inputSources) {
          for (var j = 0; j < session.inputSources.length; j++) {
            var src = session.inputSources[j];
            if (src.gamepad) {
              if (src.handedness === 'left') gpLeft = src.gamepad;
              if (src.handedness === 'right') gpRight = src.gamepad;
            }
          }
          gpSource = 'XR:' + session.inputSources.length + 'src';
          if (gpLeft) gpSource += ' L';
          if (gpRight) gpSource += ' R';
        } else {
          gpSource = session ? 'XR:no-inputs' : 'XR:no-sess';
        }
      } else {
        gpSource = 'XR:no-rdr';
      }
    } catch (e) { this._err = 'XR:' + e.message; }

    // Fallback : navigator.getGamepads
    if (!gpLeft && !gpRight) {
      try {
        var gps = navigator.getGamepads ? navigator.getGamepads() : null;
        if (gps) {
          var found = [];
          for (var m = 0; m < gps.length; m++) {
            if (gps[m]) found.push(gps[m]);
          }
          if (found.length >= 2) {
            gpLeft = found[0];
            gpRight = found[1];
            gpSource = 'NAV:' + found.length + 'gp';
          } else if (found.length === 1) {
            gpRight = found[0];
            gpSource = 'NAV:1gp';
          } else {
            gpSource = 'NAV:0gp';
          }
        }
      } catch (e) { this._err = 'NAV:' + e.message; }
    }

    var leftHand = document.querySelector('#left-hand');
    var rightHand = document.querySelector('#right-hand');
    var btnInfoL = '', btnInfoR = '';
    if (leftHand) btnInfoL = this._processHand(leftHand, this._grabL, gpLeft);
    if (rightHand) btnInfoR = this._processHand(rightHand, this._grabR, gpRight);

    // Highlight : surbrillance de l'objet le plus proche de la main droite
    try {
      if (!this._grabR.held && rightHand) {
        rightHand.object3D.getWorldPosition(this._tmpV);
        var res2 = this._findClosest(this._tmpV);
        if (this._prevHL && this._prevHL !== res2.target) {
          var hb = this._prevHL.querySelector('.interactive');
          if (hb) hb.setAttribute('material', 'opacity: 0.05; transparent: true; side: double');
        }
        if (res2.target) {
          var hb2 = res2.target.querySelector('.interactive');
          if (hb2) hb2.setAttribute('material', 'opacity: 0.1; transparent: true; color: #88ffaa; side: double');
        }
        this._prevHL = res2.target;
      }
    } catch (e) {}

    // === DEBUG TEXT (toutes les 30 frames) ===
    if (this._fc % 30 === 0) {
      try {
        var d = document.querySelector('#debug-text');
        if (d) {
          var hp = this._tmpV;
          if (rightHand) {
            rightHand.object3D.getWorldPosition(hp);
            var near = this._findClosest(hp);
            d.setAttribute('value',
              gpSource +
              '\nBtnL:' + (btnInfoL || '-') + ' BtnR:' + (btnInfoR || '-') +
              '\nGrab:' + this._grabCount +
              ' D:' + near.dist.toFixed(1) + 'm' +
              (this._err ? '\n' + this._err : '')
            );
          } else {
            d.setAttribute('value', gpSource + '\nNo hands\n' + this._err);
          }
        }
      } catch (e) {}
    }
  }
});

// ============ GRABBABLE ============
AFRAME.registerComponent('grabbable', { init: function () { this.el.classList.add('grabbable'); } });

// hand-grab est maintenant intégré dans locomotion (voir ci-dessus)

// ============ SPIN ============
AFRAME.registerComponent('spin', {
  schema: { speed: { default: 0.3 } },
  tick: function (t, dt) {
    if (this.el.getAttribute('data-grabbed')) return;
    this.el.object3D.rotation.y += this.data.speed * dt / 1000;
  }
});
</script>

  <a-light type="directional" position="1 3 1" intensity="1.0"></a-light>

  <a-light type="point" position="0 2 3" intensity="0.8"></a-light>
  <a-light type="hemisphere" color="#aaccff" groundColor="#556677" intensity="0.6"></a-light>

  <!-- SALLE -->

  <a-circle position="0 4 0" rotation="90 0 0" radius="8" color="#3a4a5a"></a-circle>
  <a-cylinder position="0 2 0" radius="7" height="4" open-ended="true" side="back" color="#3a4a6a"></a-cylinder>

    <a-text value="CFC — Cu" position="0 -0.15 0.4" align="center" color="#ffcc88" width="1.5"></a-text>

    <a-entity grabbable spin="speed: 0.2" position="0 0.4 0" scale="2.5 2.5 2.5">
      <!-- Hitbox raycaster -->
      <a-sphere class="interactive" radius="0.25" position="0.125 0.125 0.125"
                material="opacity: 0.05; transparent: true; side: double"></a-sphere>
      <!-- 8 coins -->
      <a-sphere position="0 0 0" radius="0.04" color="#e8853d"></a-sphere>
      <a-sphere position="0.25 0 0" radius="0.04" color="#e8853d"></a-sphere>
      <a-sphere position="0 0.25 0" radius="0.04" color="#e8853d"></a-sphere>
      <a-sphere position="0 0 0.25" radius="0.04" color="#e8853d"></a-sphere>
      <a-sphere position="0.25 0.25 0" radius="0.04" color="#e8853d"></a-sphere>
      <a-sphere position="0.25 0 0.25" radius="0.04" color="#e8853d"></a-sphere>
      <a-sphere position="0 0.25 0.25" radius="0.04" color="#e8853d"></a-sphere>
      <a-sphere position="0.25 0.25 0.25" radius="0.04" color="#e8853d"></a-sphere>

      <a-sphere position="0.25 0.125 0.125" radius="0.04" color="#f0a060"></a-sphere>

      <a-entity line="start: 0 0 0; end: 0 0.25 0; color: #888"></a-entity>

      <a-entity line="start: 0 0.25 0; end: 0 0.25 0.25; color: #888"></a-entity>

      <a-entity line="start: 0.25 0 0.25; end: 0.25 0.25 0.25; color: #888"></a-entity>
      <a-entity line="start: 0 0.25 0.25; end: 0.25 0.25 0.25; color: #888"></a-entity>

  </a-entity>

  <!-- ============================================================ -->

  <!-- ============================================================ -->

      <a-sphere position="0 -0.12 0" radius="0.035" color="#3498db"></a-sphere>
      <a-sphere position="0.12 -0.12 0" radius="0.025" color="#2ecc71"></a-sphere>
      <a-sphere position="-0.12 0 0" radius="0.035" color="#3498db"></a-sphere>
      <a-sphere position="0 0 0" radius="0.025" color="#2ecc71"></a-sphere>
      <a-sphere position="0.12 0 0" radius="0.035" color="#3498db"></a-sphere>
      <a-sphere position="-0.12 0.12 0" radius="0.025" color="#2ecc71"></a-sphere>
      <a-sphere position="0 0.12 0" radius="0.035" color="#3498db"></a-sphere>
      <a-sphere position="0.12 0.12 0" radius="0.025" color="#2ecc71"></a-sphere>
      <!-- k=2 layer -->
      <a-sphere position="-0.12 -0.12 0.12" radius="0.035" color="#3498db"></a-sphere>
      <a-sphere position="0 -0.12 0.12" radius="0.025" color="#2ecc71"></a-sphere>
      <a-sphere position="0.12 -0.12 0.12" radius="0.035" color="#3498db"></a-sphere>
      <a-sphere position="-0.12 0 0.12" radius="0.025" color="#2ecc71"></a-sphere>
      <a-sphere position="0 0 0.12" radius="0.035" color="#3498db"></a-sphere>
      <a-sphere position="0.12 0 0.12" radius="0.025" color="#2ecc71"></a-sphere>
      <a-sphere position="-0.12 0.12 0.12" radius="0.035" color="#3498db"></a-sphere>
      <a-sphere position="0 0.12 0.12" radius="0.025" color="#2ecc71"></a-sphere>
      <a-sphere position="0.12 0.12 0.12" radius="0.035" color="#3498db"></a-sphere>
    </a-entity>
  </a-entity>

  <!-- ============================================================ -->
  <!-- 3. DIAMANT                                                    -->
  <!-- ============================================================ -->
  <a-entity position="2 1.1 -2.5">
    <a-cylinder radius="0.35" height="0.05" color="#8899bb"></a-cylinder>
    <a-text value="Diamant" position="0 -0.15 0.4" align="center" color="#cc99ff" width="1.5"></a-text>

    <a-entity grabbable spin="speed: 0.25" position="0 0.4 0" scale="3 3 3">
      <a-sphere class="interactive" radius="0.18" position="0.1 0.1 0.1"
                material="opacity: 0.05; transparent: true; side: double"></a-sphere>
      <!-- Coins (a=0.2) -->
      <a-sphere position="0 0 0" radius="0.025" color="#9b59b6"></a-sphere>
      <a-sphere position="0.2 0 0" radius="0.025" color="#9b59b6"></a-sphere>

    <a-text value="H2O" position="0 -0.12 0.3" align="center" color="#ff6666" width="1.2"></a-text>

                material="opacity: 0.05; transparent: true; side: double"></a-sphere>
      <!-- O rouge -->
      <a-sphere position="0 0 0" radius="0.06" color="#e74c3c"></a-sphere>
      <!-- H blanc -->
      <a-sphere position="-0.08 0.06 0" radius="0.04" color="#ecf0f1"></a-sphere>
      <a-sphere position="0.08 0.06 0" radius="0.04" color="#ecf0f1"></a-sphere>
      <!-- Liaisons -->
      <a-entity line="start: 0 0 0; end: -0.08 0.06 0; color: #ccc"></a-entity>
      <a-entity line="start: 0 0 0; end: 0.08 0.06 0; color: #ccc"></a-entity>
    </a-entity>
  </a-entity>

  <!-- ============================================================ -->
  <!-- 5. BENZÈNE C6H6                                               -->
  <!-- ============================================================ -->
  <a-entity position="0 1.1 -0.8">
    <a-cylinder radius="0.35" height="0.05" color="#8899bb"></a-cylinder>
    <a-text value="Benzene C6H6" position="0 -0.15 0.4" align="center" color="#ff8888" width="1.5"></a-text>

    <a-entity grabbable spin="speed: 0.3" position="0 0.35 0" scale="3 3 3">
      <a-sphere class="interactive" radius="0.22"
                material="opacity: 0.05; transparent: true; side: double"></a-sphere>
      <!-- 6 C (r=0.1) : angles 0,60,120,180,240,300 deg -->
      <a-sphere position="0.1 0 0" radius="0.03" color="#444"></a-sphere>
      <a-sphere position="0.05 0 0.0866" radius="0.03" color="#444"></a-sphere>
      <a-sphere position="-0.05 0 0.0866" radius="0.03" color="#444"></a-sphere>
      <a-sphere position="-0.1 0 0" radius="0.03" color="#444"></a-sphere>
      <a-sphere position="-0.05 0 -0.0866" radius="0.03" color="#444"></a-sphere>
      <a-sphere position="0.05 0 -0.0866" radius="0.03" color="#444"></a-sphere>
      <!-- 6 H (r=0.18) -->
      <a-sphere position="0.18 0 0" radius="0.02" color="#ecf0f1"></a-sphere>
      <a-sphere position="0.09 0 0.1559" radius="0.02" color="#ecf0f1"></a-sphere>
      <a-sphere position="-0.09 0 0.1559" radius="0.02" color="#ecf0f1"></a-sphere>
      <a-sphere position="-0.18 0 0" radius="0.02" color="#ecf0f1"></a-sphere>
      <a-sphere position="-0.09 0 -0.1559" radius="0.02" color="#ecf0f1"></a-sphere>
      <a-sphere position="0.09 0 -0.1559" radius="0.02" color="#ecf0f1"></a-sphere>
      <!-- Liaisons C-C cycle -->
      <a-entity line="start: 0.1 0 0; end: 0.05 0 0.0866; color: #e74c3c"></a-entity>
      <a-entity line="start: 0.05 0 0.0866; end: -0.05 0 0.0866; color: #aaa"></a-entity>
      <a-entity line="start: -0.05 0 0.0866; end: -0.1 0 0; color: #e74c3c"></a-entity>
      <a-entity line="start: -0.1 0 0; end: -0.05 0 -0.0866; color: #aaa"></a-entity>
      <a-entity line="start: -0.05 0 -0.0866; end: 0.05 0 -0.0866; color: #e74c3c"></a-entity>
      <a-entity line="start: 0.05 0 -0.0866; end: 0.1 0 0; color: #aaa"></a-entity>
      <!-- Liaisons C-H -->
      <a-entity line="start: 0.1 0 0; end: 0.18 0 0; color: #999"></a-entity>
      <a-entity line="start: 0.05 0 0.0866; end: 0.09 0 0.1559; color: #999"></a-entity>
      <a-entity line="start: -0.05 0 0.0866; end: -0.09 0 0.1559; color: #999"></a-entity>
      <a-entity line="start: -0.1 0 0; end: -0.18 0 0; color: #999"></a-entity>
      <a-entity line="start: -0.05 0 -0.0866; end: -0.09 0 -0.1559; color: #999"></a-entity>
      <a-entity line="start: 0.05 0 -0.0866; end: 0.09 0 -0.1559; color: #999"></a-entity>
    </a-entity>
  </a-entity>

  <!-- ============================================================ -->
  <!-- 6. CO2                                                        -->
  <!-- ============================================================ -->
  <a-entity position="1.5 1.1 -1">
    <a-cylinder radius="0.25" height="0.05" color="#8899bb"></a-cylinder>
    <a-text value="CO2" position="0 -0.12 0.3" align="center" color="#ff6666" width="1.2"></a-text>

    <a-entity grabbable spin="speed: 0.35" position="0 0.35 0" scale="4 4 4">
      <a-sphere class="interactive" radius="0.15"
                material="opacity: 0.05; transparent: true; side: double"></a-sphere>
      <!-- C central -->
      <a-sphere position="0 0 0" radius="0.05" color="#444"></a-sphere>
      <!-- O gauche -->
      <a-sphere position="-0.1 0 0" radius="0.045" color="#e74c3c"></a-sphere>
      <!-- O droit -->
      <a-sphere position="0.1 0 0" radius="0.045" color="#e74c3c"></a-sphere>
      <!-- Doubles liaisons -->
      <a-entity line="start: 0 0 0; end: -0.1 0 0; color: #e74c3c"></a-entity>
      <a-entity line="start: 0 0.01 0; end: -0.1 0.01 0; color: #e74c3c"></a-entity>
      <a-entity line="start: 0 0 0; end: 0.1 0 0; color: #e74c3c"></a-entity>
      <a-entity line="start: 0 0.01 0; end: 0.1 0.01 0; color: #e74c3c"></a-entity>
    </a-entity>
  </a-entity>

  <!-- ===== PANNEAUX ===== -->
  <a-plane position="0 2.5 -5" width="3.5" height="1.4" color="#2a3a5a" material="opacity: 0.9"></a-plane>
  <a-text value="CRISTALLOGRAPHIE VR\nMesures Physiques — FEMTO-ST\n\nJoystick gauche : se deplacer\nJoystick droit : monter/descendre + rotation\nTRIGGER ou GRIP : saisir/relacher"
          position="0 2.5 -4.95" align="center" color="#ffffff" width="2.8" line-height="55"></a-text>

  <a-plane position="-4 2 -3.5" width="1.5" height="1.8" color="#2a3a5a"
           rotation="0 40 0" material="opacity: 0.9"></a-plane>
  <a-text value="STRUCTURES\nCRISTALLINES\n\nCFC (Cu)\na = 3.61 A\nCoord. 12\n\nNaCl\nReseau ionique\n\nDiamant\nsp3 — 109.5 deg"
          position="-4 2 -3.45" align="center" color="#ddeeff" width="1.2"
          rotation="0 40 0" line-height="50"></a-text>

  <a-plane position="4 2 -3.5" width="1.5" height="1.5" color="#2a3a5a"
           rotation="0 -40 0" material="opacity: 0.9"></a-plane>
  <a-text value="MOLECULES\n\nH2O\nAngle 104.5 deg\n1.85 D\n\nCO2\nLineaire\nC=O\n\nBenzene C6H6\nAromatique"
          position="4 2 -3.45" align="center" color="#ffeedd" width="1.2"
          rotation="0 -40 0" line-height="50"></a-text>

  <a-text id="info-label" value="" position="0 2.8 -2" align="center"
          color="#ffff88" width="3" visible="false"></a-text>

  <!-- CAMÉRA + CONTRÔLEURS + LOCOMOTION (tout dans le rig pour suivre les déplacements) -->
  <a-entity id="rig" position="0 0 2" locomotion="speed: 2.5">
    <a-camera position="0 1.6 0">
      <a-text id="debug-text" value="Pret." position="0 -0.25 -0.8" align="center"
              color="#ffff00" width="1.5" material="shader: flat"></a-text>
    </a-camera>
    <a-entity id="left-hand" laser-controls="hand: left; model: true">
      <a-sphere radius="0.05" color="#ff4444" material="shader: flat"></a-sphere>
    </a-entity>
    <a-entity id="right-hand" laser-controls="hand: right; model: true">
      <a-sphere radius="0.05" color="#4444ff" material="shader: flat"></a-sphere>
    </a-entity>
  </a-entity>

</a-scene>
